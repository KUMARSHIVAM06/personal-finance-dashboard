<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --inc:#1f8a5b; --exp:#d1495b; --sav:#2f6fdb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  h1 { margin:0; font-size:22px; }
  .live { font-size:12px; color:var(--muted); }
  .live::before { content:"● "; color:var(--inc); }
  main { padding:0 24px 24px; display:grid; gap:16px; grid-template-columns:repeat(12,1fr); }
  .card { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .kpi { grid-column:span 3; } .kpi .v { font-size:26px; font-weight:700; margin-top:6px; }
  .kpi .l { font-size:13px; color:var(--muted); }
  .wide { grid-column:span 8; } .side { grid-column:span 4; } .half { grid-column:span 6; }
  h3 { margin:0 0 12px; font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { padding:6px 4px; border-bottom:1px solid #eee; text-align:left; }
  .bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; } .bar > div { height:100%; }
  form { display:grid; gap:8px; grid-template-columns:2fr 1fr 1fr auto; }
  input,select,button { padding:8px; border:1px solid #ddd; border-radius:6px; font:inherit; }
  button { background:var(--sav); color:#fff; border:none; cursor:pointer; }
  @media (max-width:800px){ .kpi{grid-column:span 6} .wide,.side,.half{grid-column:span 12} form{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header>
  <div><h1>Personal Finance Dashboard</h1><span class="live" id="updated">Live</span></div>
  <select id="month"><option value="">All months</option></select>
</header>
<main>
  <div class="card kpi"><div class="l">Income</div><div class="v" id="k-income" style="color:var(--inc)">–</div></div>
  <div class="card kpi"><div class="l">Expense</div><div class="v" id="k-expense" style="color:var(--exp)">–</div></div>
  <div class="card kpi"><div class="l">Savings</div><div class="v" id="k-savings" style="color:var(--sav)">–</div></div>
  <div class="card kpi"><div class="l">Savings rate</div><div class="v" id="k-rate">–</div></div>

  <div class="card wide"><h3>Monthly trend</h3><canvas id="trend" height="110"></canvas></div>
  <div class="card side"><h3>Spending by category</h3><canvas id="cats"></canvas></div>

  <div class="card half"><h3>Budget vs actual (latest month)</h3><div id="budgets"></div></div>
  <div class="card half"><h3>Recent transactions</h3><table id="recent"></table></div>

  <div class="card" style="grid-column:span 12">
    <h3>Add transaction</h3>
    <form id="add">
      <input name="description" placeholder="e.g. Zomato order" required>
      <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
      <select name="txn_type"><option value="debit">Expense</option><option value="credit">Income</option></select>
      <button>Add</button>
    </form>
  </div>
</main>
<script>
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const get = u => fetch(u).then(r => r.json());
let trendChart, catChart;
const palette = ["#2f6fdb","#d1495b","#1f8a5b","#edae49","#7b5ea7","#00798c","#e07a5f","#3d405b","#81b29a","#f2cc8f","#999"];

async function loadMonths(){
  const months = await get("/api/months");
  const sel = document.getElementById("month");
  months.forEach(m => sel.add(new Option(m, m)));
}

async function refresh(){
  const m = document.getElementById("month").value;
  const q = m ? "?month=" + m : "";
  const [s, trend, cats, budgets, recent] = await Promise.all([
    get("/api/summary" + q), get("/api/monthly-trend"), get("/api/category-breakdown" + q),
    get("/api/budget-status"), get("/api/transactions?limit=8")]);

  document.getElementById("k-income").textContent = inr(s.income);
  document.getElementById("k-expense").textContent = inr(s.expense);
  document.getElementById("k-savings").textContent = inr(s.savings);
  document.getElementById("k-rate").textContent = s.savings_rate + "%";

  const labels = trend.map(r => r.month);
  const ds = [["Income","income","#1f8a5b"],["Expense","expense","#d1495b"],["Savings","savings","#2f6fdb"]]
    .map(([label,k,c]) => ({label, data: trend.map(r => r[k]), borderColor:c, backgroundColor:c, tension:.3}));
  if (!trendChart) trendChart = new Chart(document.getElementById("trend"), {type:"line", data:{labels, datasets:ds}});
  else { trendChart.data.labels = labels; trendChart.data.datasets.forEach((d,i)=>d.data = ds[i].data); trendChart.update(); }

  const cl = cats.map(c => c.category), cv = cats.map(c => c.total);
  if (!catChart) catChart = new Chart(document.getElementById("cats"),
      {type:"doughnut", data:{labels:cl, datasets:[{data:cv, backgroundColor:palette}]}, options:{plugins:{legend:{position:"bottom"}}}});
  else { catChart.data.labels = cl; catChart.data.datasets[0].data = cv; catChart.update(); }

  document.getElementById("budgets").innerHTML = budgets.map(b => {
    const pct = Math.min(100, 100 * b.spent / b.monthly_limit);
    const col = b.spent > b.monthly_limit ? "#d1495b" : "#1f8a5b";
    return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px">
      <span>${b.category}</span><span>${inr(b.spent)} / ${inr(b.monthly_limit)}</span></div>
      <div class="bar"><div style="width:${pct}%;background:${col}"></div></div></div>`;
  }).join("");

  document.getElementById("recent").innerHTML = "<tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr>" +
    recent.map(t => `<tr><td>${t.txn_date}</td><td>${t.description}</td><td>${t.category}</td>
      <td style="color:${t.txn_type==='credit'?'#1f8a5b':'#d1495b'}">${t.txn_type==='credit'?'+':'-'}${inr(t.amount)}</td></tr>`).join("");

  document.getElementById("updated").textContent = "Live · updated " + new Date().toLocaleTimeString();
}

document.getElementById("month").onchange = refresh;
document.getElementById("add").onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  await fetch("/api/transactions", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  e.target.reset(); refresh();
};

loadMonths().then(refresh);
setInterval(refresh, 10000);   // "real-time": har 10 sec me API se fresh data
</script>
</body>
</html>
